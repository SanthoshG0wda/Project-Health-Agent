<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --surface: #121418;
  --card: #1C1F26;
  --border: #2A2E38;
  --text: #E8E6E3;
  --muted: #8B8D92;
  --accent: #F4C28D;
  --red: #E0483E;
  --amber: #E8A838;
  --green: #3CB371;
  --radius: 8px;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-body);
  background: var(--surface);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chat-wrap {
  max-width: 720px;
  margin: 0 auto;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

header {
  flex-shrink: 0;
  padding: 24px 20px 16px;
  text-align: center;
}
h1 {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--muted);
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scroll-behavior: smooth;
}

.chat-msg {
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 13.5px;
  line-height: 1.6;
  max-width: 88%;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.chat-msg.user {
  background: #222734;
  border: 1px solid var(--border);
  align-self: flex-end;
  color: var(--text);
}
.chat-msg.agent {
  align-self: flex-start;
  color: #D4D2CE;
  background: transparent;
  padding: 10px 0;
}
.chat-msg.agent p { margin-bottom: 8px; }
.chat-msg.agent p:last-child { margin-bottom: 0; }
.chat-msg.agent strong { color: var(--accent); font-weight: 500; }
.chat-msg.agent ul { margin: 6px 0 6px 18px; }
.chat-msg.agent li { margin-bottom: 3px; }
.chat-msg.agent .inline-code {
  font-family: var(--font-mono);
  font-size: 12px;
  background: #1A1E28;
  padding: 1px 5px;
  border-radius: 3px;
}

.chat-msg.file-msg {
  align-self: flex-end;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-family: var(--font-mono);
  color: var(--accent);
}
.file-icon { width: 16px; height: 16px; flex-shrink: 0; }

.assess-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 4px 0 8px;
}
.assess-card-accent {
  height: 3px;
  flex-shrink: 0;
}
.assess-card-body { padding: 14px 16px; }
.assect-card-status {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  line-height: 1.2;
}
.assess-card-rec {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}
.assess-card-meta {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.assess-card-signals {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.assess-signal {
  font-size: 11.5px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.assess-signal-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.templates {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 4px 0 2px;
  animation: fadeIn 0.3s ease;
}
.template-chip {
  font-size: 12px;
  padding: 6px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.2s;
  white-space: nowrap;
}
.template-chip:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: #1F232E;
}

.chat-think {
  display: none;
  align-self: flex-start;
  font-size: 12px;
  color: var(--muted);
  font-family: var(--font-mono);
  padding: 6px 0;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

.chat-footer {
  flex-shrink: 0;
  padding: 12px 20px 20px;
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.attach-btn {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.2s;
  flex-shrink: 0;
}
.attach-btn:hover { border-color: var(--accent); color: var(--accent); }
.attach-btn svg { width: 18px; height: 18px; }
.chat-input {
  flex: 1;
  padding: 10px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13.5px;
  outline: none;
  transition: border-color 0.2s;
}
.chat-input:focus { border-color: var(--accent); }
.chat-input::placeholder { color: var(--muted); }
.chat-send {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: 1px solid var(--accent);
  border-radius: 8px;
  cursor: pointer;
  color: var(--accent);
  transition: all 0.2s;
  flex-shrink: 0;
}
.chat-send:hover { background: var(--accent); color: var(--surface); }
.chat-send:disabled { opacity: 0.25; cursor: not-allowed; border-color: var(--border); color: var(--muted); }
.chat-send svg { width: 18px; height: 18px; }

.toast {
  display: none;
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 20px;
  background: #1C1414;
  border: 1px solid var(--red);
  border-radius: var(--radius);
  font-size: 13px;
  color: #ccc;
  z-index: 10;
  animation: fadeIn 0.2s ease;
  max-width: 90%;
  text-align: center;
}
.toast .label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--red);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 2px;
}

@media (max-width: 640px) {
  header { padding: 16px 16px 12px; }
  .chat-messages { padding: 4px 12px; }
  .chat-msg { max-width: 95%; font-size: 13px; }
  .chat-footer { padding: 10px 12px 16px; }
}
</style>
</head>
<body>

<div class="chat-wrap">
  <header>
    <h1>Project Health</h1>
  </header>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-think" id="chatThink">Thinking</div>

  <div class="chat-footer">
    <button class="attach-btn" id="attachBtn" title="Upload project plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
      </svg>
    </button>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    <input class="chat-input" id="chatInput" type="text" placeholder="Upload a file or type a message…" autocomplete="off">
    <button class="chat-send" id="chatSend" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<div class="toast" id="toast">
  <div class="label">Error</div>
  <div id="toastMsg"></div>
</div>

<script>
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('chatSend');
const chatThink = document.getElementById('chatThink');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toastMsg');

let currentSessionId = '';
let chatContext = 'idle';
const STORAGE_KEY = 'ph_session_id';

function log(m) { console.log(m); }

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) uploadFile(fileInput.files[0]);
});
chatSend.addEventListener('click', sendText);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});
chatInput.addEventListener('input', () => {
  chatSend.disabled = !chatInput.value.trim();
});

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/### (.+)/g, '<strong>$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<span class="inline-code">$1</span>')
    .replace(/^- (.+)/gm, '<br>&bull; $1')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  div.innerHTML = text;
  chatMessages.appendChild(div);
  scrollBottom();
}

function addFileMsg(name) {
  const div = document.createElement('div');
  div.className = 'chat-msg file-msg';
  div.innerHTML = '<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' + esc(name);
  chatMessages.appendChild(div);
  scrollBottom();
}

function showTemplates(buttons) {
  const existing = chatMessages.querySelector('.templates');
  if (existing) existing.remove();
  const wrap = document.createElement('div');
  wrap.className = 'templates';
  buttons.forEach(function(b) {
    const chip = document.createElement('span');
    chip.className = 'template-chip';
    chip.textContent = b.label;
    chip.addEventListener('click', b.action);
    wrap.appendChild(chip);
  });
  chatMessages.appendChild(wrap);
  scrollBottom();
}

function scrollBottom() {
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function showToast(msg) {
  toastMsg.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 5000);
}

// ---- Templates ----

function idleTemplates() {
  showTemplates([
    { label: 'Upload a project plan', action: () => fileInput.click() },
    { label: 'How does RAG scoring work?', action: () => sendTemplate('Explain how the RAG scoring rules work for each signal') },
    { label: 'What data is extracted?', action: () => sendTemplate('What fields and metrics do you extract from the project plan?') },
  ]);
}

function loadedTemplates() {
  showTemplates([
    { label: 'Break down each signal', action: () => sendTemplate('Give me a detailed breakdown of each RAG signal and what drove the score') },
    { label: 'Risk mitigation plan', action: () => sendTemplate('Based on the signals, draft a risk mitigation plan') },
    { label: 'Schedule deep dive', action: () => sendTemplate('Analyze the schedule health in detail — which tasks are slipping and why') },
    { label: 'Compare with benchmarks', action: () => sendTemplate('How does this project compare to typical RAG benchmarks for similar programs?') },
  ]);
}

function sendTemplate(text) {
  chatInput.value = text;
  chatSend.disabled = false;
  sendText();
}

// ---- Send ----

async function sendText() {
  const msg = chatInput.value.trim();
  if (!msg) return;

  chatInput.value = '';
  chatSend.disabled = true;
  const templates = chatMessages.querySelector('.templates');
  if (templates) templates.remove();

  addMessage(esc(msg), 'user');

  if (!currentSessionId) {
    addMessage(render('Upload a project plan first so I can analyze it. Click the attach button to upload a file.'), 'agent');
    idleTemplates();
    return;
  }

  chatThink.style.display = 'block';
  scrollBottom();

  try {
    const form = new FormData();
    form.append('message', msg);
    form.append('session_id', currentSessionId);

    const res = await fetch('/chat', { method: 'POST', body: form });
    const data = await res.json();
    chatThink.style.display = 'none';

    if (!res.ok) {
      addMessage(esc(data.detail || 'Chat failed'), 'agent');
      return;
    }
    addMessage(render(data.response), 'agent');
    loadedTemplates();
  } catch (e) {
    chatThink.style.display = 'none';
    addMessage(esc('Network error: ' + e.message), 'agent');
  }
}

// ---- Upload ----

async function uploadFile(file) {
  if (!file.name.match(/\.xlsx?$/i)) {
    showToast('Please upload an Excel file (.xlsx or .xls)');
    return;
  }

  addFileMsg(file.name);

  chatThink.style.display = 'block';
  scrollBottom();

  try {
    const form = new FormData();
    form.append('file', file);

    const res = await fetch('/assess', { method: 'POST', body: form });
    const data = await res.json();
    chatThink.style.display = 'none';

    if (!res.ok) {
      addMessage(esc(data.detail || 'Assessment failed'), 'agent');
      idleTemplates();
      return;
    }

    currentSessionId = data.session_id;
    localStorage.setItem(STORAGE_KEY, currentSessionId);

    renderAssessment(data);
    loadedTemplates();
    chatInput.placeholder = 'Ask a question about this project…';
  } catch (e) {
    chatThink.style.display = 'none';
    addMessage(esc('Upload error: ' + e.message), 'agent');
    idleTemplates();
  } finally {
    fileInput.value = '';
  }
}

function renderAssessment(data) {
  const ex = data.extracted;
  const rag = data.rag;
  const overall = rag.overall_status;
  const colorMap = { Red: '#E0483E', Amber: '#E8A838', Green: '#3CB371', insufficient_data: '#8B8D92' };
  const color = colorMap[overall] || '#8B8D92';
  const label = overall === 'insufficient_data' ? 'Insufficient Data' : overall;
  const rec = overall === 'Red' ? 'Escalate to leadership immediately.' :
    overall === 'Amber' ? 'Monitor closely and prepare mitigation plan.' : 'Project is on track.';

  const signalLabels = {
    schedule_slippage: 'Schedule', budget_burn: 'Budget',
    milestone_health: 'Milestones', blockers: 'Blockers',
    stakeholder_sentiment: 'Sentiment'
  };

  let signalsHtml = '';
  for (const [key, sig] of Object.entries(rag.signals)) {
    const sc = colorMap[sig.status] || '#8B8D92';
    signalsHtml += '<span class="assess-signal"><span class="assess-signal-dot" style="background:' + sc + '"></span>' + (signalLabels[key] || key) + ': ' + sig.status + '</span>';
  }

  const html = '<div class="assess-card">'
    + '<div class="assess-card-accent" style="background:' + color + '"></div>'
    + '<div class="assess-card-body">'
    + '<div class="assect-card-status" style="color:' + color + '">' + label + '</div>'
    + '<div class="assess-card-rec">' + rec + '</div>'
    + '<div class="assess-card-meta">'
    + '<span>' + esc(ex.project_name) + '</span>'
    + '<span>' + (ex.project_manager ? esc(ex.project_manager) : '—') + '</span>'
    + '<span>' + (ex.pct_complete != null ? Math.round(ex.pct_complete * 100) + '%' : '—') + '</span>'
    + '<span>' + (ex.as_of_date ? ex.as_of_date.slice(0, 10) : '—') + '</span>'
    + '</div>'
    + '<div class="assess-card-signals">' + signalsHtml + '</div>'
    + '</div></div>';

  addMessage(html, 'agent');
}

// ---- Init ----

async function init() {
  const savedId = localStorage.getItem(STORAGE_KEY);
  if (savedId) {
    try {
      const res = await fetch('/sessions/' + savedId);
      const data = await res.json();
      if (res.ok && data.session && data.messages.length) {
        currentSessionId = savedId;
        chatContext = 'loaded';
        chatInput.placeholder = 'Ask a question about this project…';
        data.messages.forEach(function(m) {
          if (m.role === 'user') {
            addMessage(esc(m.content), 'user');
          } else if (m.content.startsWith('<div class="assess-card"')) {
            addMessage(m.content, 'agent');
          } else {
            addMessage(render(m.content), 'agent');
          }
        });
        loadedTemplates();
        scrollBottom();
        return;
      }
    } catch (e) { /* ignore */ }
    localStorage.removeItem(STORAGE_KEY);
  }

  addMessage(render('Upload a project plan and I\'ll assess its health across schedule, budget, milestones, blockers, and stakeholder sentiment.'), 'agent');
  idleTemplates();
}

init();
</script>
</body>
</html>
