<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --surface: #121418;
  --card: #1C1F26;
  --border: #2A2E38;
  --text: #E8E6E3;
  --muted: #8B8D92;
  --accent: #F4C28D;
  --red: #E0483E;
  --amber: #E8A838;
  --green: #3CB371;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-body);
  background: var(--surface);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

.chat-wrap {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
}

header {
  flex-shrink: 0;
  padding: 18px 20px 10px;
  text-align: center;
}
h1 {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--muted);
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0;
  display: flex;
  flex-direction: column;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
@supports (scrollbar-width: thin) { .chat-messages { scrollbar-width: thin; scrollbar-color: var(--border) transparent; } }

.msg-group {
  padding: 8px 0;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg-label {
  font-size: 11px;
  color: var(--muted);
  padding: 0 20px;
  margin-bottom: 4px;
}
.msg-bubble {
  padding: 4px 20px;
  font-size: 14px;
  line-height: 1.65;
}
.msg-bubble.user {
  color: var(--text);
}
.msg-bubble.agent {
  color: #D4D2CE;
}
.msg-bubble.agent p { margin-bottom: 10px; }
.msg-bubble.agent p:last-child { margin-bottom: 0; }
.msg-bubble.agent strong { color: var(--accent); font-weight: 500; }
.msg-bubble.agent ul { margin: 6px 0 6px 20px; }
.msg-bubble.agent li { margin-bottom: 4px; }
.msg-bubble.agent .inline-code {
  font-family: var(--font-mono);
  font-size: 13px;
  background: #1A1E28;
  padding: 1px 5px;
  border-radius: 3px;
}

.status-label {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.signal-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  margin: 3px 0;
}
.signal-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.file-msg {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-family: var(--font-mono);
  color: var(--accent);
  padding: 2px 20px;
}
.file-icon { width: 15px; height: 15px; flex-shrink: 0; }

.templates {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 4px 20px 8px;
  animation: fadeIn 0.3s ease;
}
.template-chip {
  font-size: 12px;
  padding: 5px 13px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.2s;
  white-space: nowrap;
}
.template-chip:hover { border-color: var(--accent); color: var(--accent); }

.think-indicator {
  display: none;
  padding: 8px 20px;
  font-size: 12px;
  color: var(--muted);
  font-family: var(--font-mono);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%, 50%, 100% { opacity: 0.4; } 25%, 75% { opacity: 1; } }

.input-area {
  flex-shrink: 0;
  padding: 8px 0 16px;
}
.input-inner {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 6px 6px 6px 16px;
  transition: border-color 0.2s;
}
.input-inner:focus-within { border-color: var(--accent); }
.attach-btn {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--muted);
  transition: color 0.2s;
  flex-shrink: 0;
  background: none;
  border: none;
  padding: 0;
}
.attach-btn:hover { color: var(--accent); }
.attach-btn svg { width: 18px; height: 18px; }
.chat-input {
  flex: 1;
  padding: 8px 0;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
  resize: none;
}
.chat-input::placeholder { color: var(--muted); }
.chat-send {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  color: var(--surface);
  transition: opacity 0.2s;
  flex-shrink: 0;
  padding: 0;
}
.chat-send:disabled { opacity: 0.25; cursor: not-allowed; }
.chat-send:hover:not(:disabled) { opacity: 0.85; }
.chat-send svg { width: 16px; height: 16px; }

.toast {
  display: none;
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 20px;
  background: #1C1414;
  border: 1px solid var(--red);
  border-radius: 10px;
  font-size: 13px;
  color: #ccc;
  z-index: 10;
  animation: fadeIn 0.2s ease;
  max-width: 90%;
  text-align: center;
}
.toast .toast-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--red);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 2px;
}

@media (max-width: 768px) {
  .chat-wrap { max-width: 100%; padding: 0 8px; }
  header { padding: 14px 12px 8px; }
  .msg-bubble { padding: 3px 12px; font-size: 13.5px; }
  .msg-label { padding: 0 12px; }
  .templates { padding: 4px 12px; }
  .input-area { padding: 4px 4px 12px; }
  .input-inner { padding: 4px 4px 4px 12px; border-radius: 10px; }
}
</style>
</head>
<body>

<div class="chat-wrap">
  <header>
    <h1>Project Health</h1>
  </header>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-think" id="chatThink">Thinking</div>

  <div class="chat-footer">
    <button class="attach-btn" id="attachBtn" title="Upload project plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
      </svg>
    </button>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    <input class="chat-input" id="chatInput" type="text" placeholder="Upload a file or type a message…" autocomplete="off">
    <button class="chat-send" id="chatSend" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<div class="toast" id="toast">
  <div class="label">Error</div>
  <div id="toastMsg"></div>
</div>

<script>
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('chatSend');
const chatThink = document.getElementById('chatThink');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toastMsg');

let currentSessionId = '';
let pendingFile = null;
const STORAGE_KEY = 'ph_session_id';

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) selectFile(fileInput.files[0]);
});
chatSend.addEventListener('click', sendText);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});
chatInput.addEventListener('input', () => {
  chatSend.disabled = !chatInput.value.trim() && !pendingFile;
});

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/### (.+)/g, '<strong>$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<span class="inline-code">$1</span>')
    .replace(/^- (.+)/gm, '<br>&bull; $1')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
}

function addMessage(text, role) {
  const group = document.createElement('div');
  group.className = 'msg-group';
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : 'Project Health';
  group.appendChild(label);
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble ' + role;
  bubble.innerHTML = text;
  group.appendChild(bubble);
  chatMessages.appendChild(group);
  scrollBottom();
}

function addFileMsg(name) {
  const group = document.createElement('div');
  group.className = 'msg-group';
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'You';
  group.appendChild(label);
  const div = document.createElement('div');
  div.className = 'file-msg';
  div.innerHTML = '<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' + esc(name);
  group.appendChild(div);
  chatMessages.appendChild(group);
  scrollBottom();
}

function showTemplates(buttons) {
  const existing = chatMessages.querySelector('.templates');
  if (existing) existing.remove();
  const wrap = document.createElement('div');
  wrap.className = 'templates';
  buttons.forEach(function(b) {
    const chip = document.createElement('span');
    chip.className = 'template-chip';
    chip.textContent = b.label;
    chip.addEventListener('click', b.action);
    wrap.appendChild(chip);
  });
  chatMessages.appendChild(wrap);
  scrollBottom();
}

function scrollBottom() {
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function downloadReport() {
  if (!currentSessionId) return;
  const a = document.createElement('a');
  a.href = '/report/' + currentSessionId;
  a.download = '';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function showToast(msg) {
  toastMsg.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 5000);
}

// ---- Templates ----

function idleTemplates() {
  showTemplates([
    { label: 'Upload a project plan', action: () => fileInput.click() },
    { label: 'How does RAG scoring work?', action: () => sendTemplate('Explain how the RAG scoring rules work for each signal') },
    { label: 'What data is extracted?', action: () => sendTemplate('What fields and metrics do you extract from the project plan?') },
  ]);
}

function loadedTemplates() {
  showTemplates([
    { label: 'Break down each signal', action: () => sendTemplate('Give me a detailed breakdown of each RAG signal and what drove the score') },
    { label: 'Risk mitigation plan', action: () => sendTemplate('Based on the signals, draft a risk mitigation plan') },
    { label: 'Schedule deep dive', action: () => sendTemplate('Analyze the schedule health in detail — which tasks are slipping and why') },
    { label: 'Download Report', action: downloadReport },
  ]);
}

function sendTemplate(text) {
  chatInput.value = text;
  chatSend.disabled = false;
  sendText();
}

// ---- Send ----

async function sendText() {
  const msg = chatInput.value.trim();
  if (!msg && !pendingFile) return;

  const templates = chatMessages.querySelector('.templates');
  if (templates) templates.remove();

  // If a file is queued, upload it first
  if (pendingFile) {
    const file = pendingFile;
    pendingFile = null;
    removePendingFile();
    const result = await uploadAndAssess(file);
    if (!result) return; // upload failed, error already shown
    if (!msg) {
      chatInput.focus();
      loadedTemplates();
      return; // just upload, no message
    }
  }

  if (!msg) return;
  chatInput.value = '';
  chatSend.disabled = !pendingFile;

  addMessage(esc(msg), 'user');

  if (!currentSessionId) {
    addMessage(render('Upload a project plan first so I can analyze it.'), 'agent');
    idleTemplates();
    return;
  }

  chatThink.style.display = 'block';
  scrollBottom();

  try {
    const form = new FormData();
    form.append('message', msg);
    form.append('session_id', currentSessionId);

    const res = await fetch('/chat', { method: 'POST', body: form });
    const data = await res.json();
    chatThink.style.display = 'none';

    if (!res.ok) {
      addMessage(esc(data.detail || 'Chat failed'), 'agent');
      return;
    }
    addMessage(render(data.response), 'agent');
    loadedTemplates();
  } catch (e) {
    chatThink.style.display = 'none';
    addMessage(esc('Network error: ' + e.message), 'agent');
  }
}

// ---- File select (queues, does not upload) ----

function selectFile(file) {
  if (!file.name.match(/\.xlsx?$/i)) {
    showToast('Please upload an Excel file (.xlsx or .xls)');
    return;
  }
  pendingFile = file;
  chatSend.disabled = false;
  showPendingFile(file.name);
}

function showPendingFile(name) {
  const existing = document.getElementById('pendingFile');
  if (existing) existing.remove();
  const chip = document.createElement('div');
  chip.id = 'pendingFile';
  chip.style.cssText = 'display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--accent);background:var(--surface);border-radius:6px;padding:3px 8px;margin:2px 0;';
  chip.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
    + '<span>' + esc(name) + '</span>'
    + '<span style="cursor:pointer;color:var(--muted);margin-left:2px" onclick="removePendingFile()">✕</span>';
  chatInput.parentNode.insertBefore(chip, chatInput);
}

function removePendingFile() {
  pendingFile = null;
  const chip = document.getElementById('pendingFile');
  if (chip) chip.remove();
  chatSend.disabled = !chatInput.value.trim();
}

// ---- Upload + Assess (called from sendText when file is queued) ----

async function uploadAndAssess(file) {
  addFileMsg(file.name);
  chatThink.style.display = 'block';
  scrollBottom();

  const form = new FormData();
  form.append('file', file);
  const res = await fetch('/assess', { method: 'POST', body: form });
  const data = await res.json();
  chatThink.style.display = 'none';

  if (!res.ok) {
    addMessage(esc(data.detail || 'Assessment failed'), 'agent');
    idleTemplates();
    return null;
  }

  currentSessionId = data.session_id;
  localStorage.setItem(STORAGE_KEY, currentSessionId);
  renderAssessment(data);
  loadedTemplates();
  chatInput.placeholder = 'Ask a question about this project…';
  return data;
}

function renderAssessment(data) {
  const ex = data.extracted;
  const rag = data.rag;
  const overall = rag.overall_status;
  const colorMap = { Red: '#E0483E', Amber: '#E8A838', Green: '#3CB371', insufficient_data: '#8B8D92' };
  const color = colorMap[overall] || '#8B8D92';
  const label = overall === 'insufficient_data' ? 'Insufficient Data' : overall;
  const rec = overall === 'Red' ? 'Escalate to leadership immediately.' :
    overall === 'Amber' ? 'Monitor closely and prepare mitigation plan.' : 'Project is on track.';

  let signalsHtml = '';
  const signalLabels = { schedule_slippage: 'Schedule', budget_burn: 'Budget', milestone_health: 'Milestones', blockers: 'Blockers', stakeholder_sentiment: 'Sentiment' };
  for (const [key, sig] of Object.entries(rag.signals)) {
    const sc = colorMap[sig.status] || '#8B8D92';
    signalsHtml += '<div class="signal-row"><span class="signal-dot" style="background:' + sc + '"></span>' + (signalLabels[key] || key) + ': <strong style="color:' + sc + '">' + sig.status + '</strong></div>';
  }

  const details = esc(ex.project_name) + ' · ' + (ex.project_manager ? esc(ex.project_manager) : '—') + ' · ' + (ex.pct_complete != null ? Math.round(ex.pct_complete * 100) + '%' : '—');

  const html = '<p><span class="status-label" style="color:' + color + '">' + label + '</span></p>'
    + '<p>' + rec + '</p>'
    + '<p style="font-size:12px;color:var(--muted)">' + details + '</p>'
    + signalsHtml;

  addMessage(html, 'agent');
}

// ---- Init ----

async function init() {
  const savedId = localStorage.getItem(STORAGE_KEY);
  if (savedId) {
    try {
      const res = await fetch('/sessions/' + savedId);
      const data = await res.json();
      if (res.ok && data.session && data.messages.length) {
        currentSessionId = savedId;
        chatContext = 'loaded';
        chatInput.placeholder = 'Ask a question about this project…';
        data.messages.forEach(function(m) {
          if (m.role === 'user') {
            addMessage(esc(m.content), 'user');
          } else {
            addMessage(render(m.content), 'agent');
          }
        });
        loadedTemplates();
        scrollBottom();
        return;
      }
    } catch (e) { /* ignore */ }
    localStorage.removeItem(STORAGE_KEY);
  }

  addMessage(render('Upload a project plan and I\'ll assess its health across schedule, budget, milestones, blockers, and stakeholder sentiment. Click the attach button to select a file, then type your question.'), 'agent');
  idleTemplates();
}

init();
</script>
</body>
</html>
