<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #212121;
  --surface: #2f2f2f;
  --border: #3b3b3b;
  --text: #e4e4e4;
  --muted: #8e8e8e;
  --accent: #d4a76a;
  --red: #e05a4f;
  --amber: #d4a76a;
  --green: #5aad6a;
  --radius: 10px;
  --font: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', monospace;
}
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

.app {
  max-width: 760px;
  width: 100%;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.head {
  flex-shrink: 0;
  padding: 16px 16px 8px;
  text-align: center;
}
.head h1 {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--muted);
}

.msgs {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  scroll-behavior: smooth;
}
.msgs::-webkit-scrollbar { width: 4px; }
.msgs::-webkit-scrollbar-track { background: transparent; }
.msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.msg {
  padding: 10px 16px;
  line-height: 1.65;
  font-size: 14.5px;
  animation: in 0.2s ease;
}
@keyframes in { from { opacity: 0; } to { opacity: 1; } }
.msg.user {
  background: var(--surface);
  margin: 4px 16px;
  border-radius: var(--radius);
  max-width: 80%;
  align-self: flex-end;
}
.msg.agent {
  color: #d4d4d4;
  padding: 10px 16px;
}
.msg.agent p { margin-bottom: 10px; }
.msg.agent p:last-child { margin-bottom: 0; }
.msg.agent strong { color: var(--accent); font-weight: 500; }
.msg.agent ul { margin: 6px 0 6px 20px; }
.msg.agent li { margin-bottom: 4px; }
.msg.agent code {
  font-family: var(--mono);
  font-size: 13px;
  background: #1a1a1a;
  padding: 1px 5px;
  border-radius: 3px;
}

.msg.file {
  margin: 4px 16px;
  padding: 8px 14px;
  background: var(--surface);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-family: var(--mono);
  color: var(--accent);
  max-width: 80%;
  align-self: flex-end;
}

.stat {
  display: inline-block;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.sig {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  margin: 4px 0;
}
.sig-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.templates {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 0 16px 4px;
  animation: in 0.3s ease;
}
.t-chip {
  font-size: 12px;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  color: var(--muted);
  background: transparent;
  transition: all 0.2s;
  white-space: nowrap;
}
.t-chip:hover { border-color: var(--accent); color: var(--accent); }

.think {
  display: none;
  padding: 6px 16px;
  font-size: 12px;
  color: var(--muted);
  font-family: var(--mono);
  animation: blink 1.5s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

.foot {
  flex-shrink: 0;
  padding: 8px 16px 16px;
}
.foot-in {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px 4px 4px 14px;
  transition: border-color .2s;
}
.foot-in:focus-within { border-color: var(--muted); }
.att {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--muted);
  background: none; border: none; padding: 0;
  flex-shrink: 0;
  transition: color .2s;
}
.att:hover { color: var(--accent); }
.att svg { width: 18px; height: 18px; }
.inp {
  flex: 1;
  padding: 8px 0;
  background: none; border: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 14.5px;
  outline: none;
  resize: none;
}
.inp::placeholder { color: var(--muted); }
.snd {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: var(--text); border: none; border-radius: 8px;
  cursor: pointer; color: var(--bg);
  flex-shrink: 0; padding: 0;
  transition: opacity .2s;
}
.snd:disabled { opacity: .2; cursor: default; }
.snd:hover:not(:disabled) { opacity: .85; }
.snd svg { width: 15px; height: 15px; }

.pending {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 11px; color: var(--accent);
  padding: 2px 0; margin: 0 0 2px;
}
.pending-rm { cursor: pointer; color: var(--muted); font-size: 13px; margin-left: 2px; }
.pending-rm:hover { color: var(--red); }

.toast {
  display: none; position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%); padding: 10px 20px;
  background: #1c1414; border: 1px solid var(--red);
  border-radius: 10px; font-size: 13px; color: #ccc;
  z-index: 10; animation: in .2s ease; max-width: 90%; text-align: center;
}
.toast .tl {
  font-family: var(--mono); font-size: 10px; color: var(--red);
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 2px;
}

@media (max-width: 640px) {
  .msg { font-size: 14px; padding: 8px 12px; }
  .msg.user { margin: 4px 10px; }
  .foot { padding: 6px 10px 12px; }
  .templates { padding: 0 10px 4px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="head">
    <h1>Project Health</h1>
  </div>

  <div class="msgs" id="msgs"></div>
  <div class="think" id="think">Thinking...</div>

  <div class="foot">
    <div class="foot-in">
      <button class="att" id="att" title="Upload project plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <input type="file" id="file" accept=".xlsx,.xls" style="display:none">
      <div style="flex:1;display:flex;flex-direction:column" id="inputWrap">
        <input class="inp" id="inp" type="text" placeholder="Upload a file or type a message…" autocomplete="off">
      </div>
      <button class="snd" id="snd" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <div class="tl">Error</div>
  <div id="toastMsg"></div>
</div>

<script>
const msgs = document.getElementById('msgs');
const inp = document.getElementById('inp');
const snd = document.getElementById('snd');
const think = document.getElementById('think');
const att = document.getElementById('att');
const file = document.getElementById('file');
const inputWrap = document.getElementById('inputWrap');
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toastMsg');

let sid = '';
let pending = null;
const KEY = 'ph_sid';

att.addEventListener('click', () => file.click());
file.addEventListener('change', () => { if (file.files.length) pick(file.files[0]); });
snd.addEventListener('click', send);
inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
inp.addEventListener('input', () => { snd.disabled = !inp.value.trim() && !pending; });

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(t) {
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/### (.+)/g, '<strong>$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/^- (.+)/gm, '<br>&bull; $1')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
}

function add(text, role) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = text;
  msgs.appendChild(el);
  scroll();
}

function addFile(name) {
  const el = document.createElement('div');
  el.className = 'msg file';
  el.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' + esc(name);
  msgs.appendChild(el);
  scroll();
}

function chips(btns) {
  const old = msgs.querySelector('.templates');
  if (old) old.remove();
  const w = document.createElement('div');
  w.className = 'templates';
  btns.forEach(function(b) {
    const c = document.createElement('span');
    c.className = 't-chip';
    c.textContent = b.label;
    c.addEventListener('click', b.action);
    w.appendChild(c);
  });
  msgs.appendChild(w);
  scroll();
}

function scroll() { msgs.scrollTop = msgs.scrollHeight; }

function show(m) { toastMsg.textContent = m; toast.style.display = 'block'; setTimeout(() => { toast.style.display = 'none'; }, 5000); }

// ---- Templates ----

function idleChips() {
  chips([
    { label: 'Upload a project', action: () => file.click() },
    { label: 'How does RAG work?', action: () => q('How does the RAG scoring work?') },
    { label: 'What data is extracted?', action: () => q('What fields do you extract from a project plan?') },
  ]);
}

function loadedChips() {
  chips([
    { label: 'Break down each signal', action: () => q('Give me a detailed breakdown of each RAG signal and what drove the score') },
    { label: 'Risk mitigation plan', action: () => q('Based on the signals, draft a risk mitigation plan') },
    { label: 'Schedule deep dive', action: () => q('Analyze the schedule health in detail') },
    { label: 'Download report', action: dlReport },
  ]);
}

function q(text) { inp.value = text; snd.disabled = false; send(); }

// ---- Send ----

async function send() {
  const msg = inp.value.trim();
  if (!msg && !pending) return;

  const ts = msgs.querySelector('.templates');
  if (ts) ts.remove();

  if (pending) {
    const f = pending; pending = null;
    rmPending();
    const ok = await upload(f);
    if (!ok) return;
    if (!msg) { inp.focus(); loadedChips(); return; }
  }

  if (!msg) return;
  inp.value = '';
  snd.disabled = !pending;

  add(esc(msg), 'user');

  if (!sid) {
    add(render('Upload a project plan first. Click the attach button to select a file.'), 'user');
    idleChips();
    return;
  }

  think.style.display = 'block';
  scroll();

  try {
    const fd = new FormData();
    fd.append('message', msg);
    fd.append('session_id', sid);
    const res = await fetch('/chat', { method: 'POST', body: fd });
    const d = await res.json();
    think.style.display = 'none';
    if (!res.ok) { add(esc(d.detail || 'Failed'), 'agent'); return; }
    add(render(d.response), 'agent');
    loadedChips();
  } catch(e) {
    think.style.display = 'none';
    add(esc('Error: ' + e.message), 'agent');
  }
}

// ---- File ----

function pick(f) {
  if (!f.name.match(/\.xlsx?$/i)) { show('Please upload an Excel file (.xlsx or .xls)'); return; }
  pending = f;
  snd.disabled = false;
  showPending(f.name);
}

function showPending(name) {
  const old = document.getElementById('_pf');
  if (old) old.remove();
  const d = document.createElement('div');
  d.id = '_pf';
  d.className = 'pending';
  d.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
    + '<span>' + esc(name) + '</span>'
    + '<span class="pending-rm" onclick="rmPending();pending=null;snd.disabled=!inp.value.trim()">✕</span>';
  inputWrap.prepend(d);
}

function rmPending() {
  const d = document.getElementById('_pf');
  if (d) d.remove();
}

async function upload(f) {
  addFile(f.name);
  think.style.display = 'block';
  scroll();

  const fd = new FormData();
  fd.append('file', f);
  const res = await fetch('/assess', { method: 'POST', body: fd });
  const d = await res.json();
  think.style.display = 'none';

  if (!res.ok) { add(esc(d.detail || 'Upload failed'), 'agent'); idleChips(); return false; }

  sid = d.session_id;
  localStorage.setItem(KEY, sid);
  renderAssess(d);
  loadedChips();
  inp.placeholder = 'Ask a question about this project…';
  return true;
}

function renderAssess(d) {
  const ex = d.extracted;
  const rag = d.rag;
  const o = rag.overall_status;
  const cm = { Red: '#e05a4f', Amber: '#d4a76a', Green: '#5aad6a', insufficient_data: '#8e8e8e' };
  const c = cm[o] || '#8e8e8e';
  const lb = o === 'insufficient_data' ? 'Insufficient Data' : o;
  const rec = o === 'Red' ? 'Escalate to leadership immediately.' :
    o === 'Amber' ? 'Monitor closely and prepare mitigation plan.' : 'Project is on track.';

  let sigs = '';
  const sl = { schedule_slippage: 'Schedule', budget_burn: 'Budget', milestone_health: 'Milestones', blockers: 'Blockers', stakeholder_sentiment: 'Sentiment' };
  for (const [k, v] of Object.entries(rag.signals)) {
    const sc = cm[v.status] || '#8e8e8e';
    sigs += '<div class="sig"><span class="sig-dot" style="background:' + sc + '"></span>' + (sl[k] || k) + ': <strong style="color:' + sc + '">' + v.status + '</strong></div>';
  }
  const meta = esc(ex.project_name) + ' · ' + (ex.project_manager ? esc(ex.project_manager) : '—') + ' · ' + (ex.pct_complete != null ? Math.round(ex.pct_complete * 100) + '%' : '—');

  add('<p><span class="stat" style="color:' + c + '">' + lb + '</span></p><p>' + rec + '</p><p style="font-size:12px;color:var(--muted)">' + meta + '</p>' + sigs, 'agent');
}

function dlReport() {
  if (!sid) return;
  const a = document.createElement('a');
  a.href = '/report/' + sid;
  a.download = '';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ---- Init ----

async function init() {
  const saved = localStorage.getItem(KEY);
  if (saved) {
    try {
      const res = await fetch('/sessions/' + saved);
      const d = await res.json();
      if (res.ok && d.session && d.messages.length) {
        sid = saved;
        inp.placeholder = 'Ask a question about this project…';
        d.messages.forEach(function(m) {
          if (m.role === 'user') { add(esc(m.content), 'user'); }
          else { add(render(m.content), 'agent'); }
        });
        loadedChips();
        scroll();
        return;
      }
    } catch(e) {}
    localStorage.removeItem(KEY);
  }
  add(render('Upload a project plan and I\'ll assess its health across schedule, budget, milestones, blockers, and stakeholder sentiment.'), 'agent');
  idleChips();
}

init();
</script>
</body>
</html>
